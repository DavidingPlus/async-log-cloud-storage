<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>异步日志存储系统</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --background: #f5f6fa;
            --card-bg: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background);
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 2rem;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .upload-section {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--primary-color);
            font-weight: 500;
        }

        input[type="file"] {
            border: 2px dashed #ddd;
            padding: 1rem;
            width: 100%;
            border-radius: 5px;
            cursor: pointer;
        }

        .storage-type {
            display: flex;
            gap: 1rem;
            margin: 1rem 0;
        }

        .storage-type label {
            background: #f0f0f0;
            padding: 0.8rem 1.5rem;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .storage-type input:checked+label {
            background: var(--secondary-color);
            color: white;
        }

        button,
        .download-link {
            background: var(--secondary-color);
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
        }

        button:hover,
        .download-link:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .file-list {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem;
            border-bottom: 1px solid #eee;
        }

        .file-info {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .file-type {
            background: #eee;
            padding: 0.3rem 0.8rem;
            border-radius: 5px;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>📁异步日志存储系统</h1>

        <div class="upload-section">
            <div class="form-group">
                <label>选择文件</label>
                <input type="file" id="fileInput">
            </div>

            <div class="form-group">
                <label>存储类型</label>
                <div class="storage-type">
                    <div>
                        <input type="radio" name="storageType" id="uncompressedStorage" value="uncompressed" checked>
                        <label for="uncompressedStorage">未压缩存储</label>
                    </div>
                    <div>
                        <input type="radio" name="storageType" id="compressedStorage" value="compressed">
                        <label for="compressedStorage">压缩存储</label>
                    </div>
                </div>
            </div>

            <button onclick="uploadFile()">
                ⬆️ 开始上传
            </button>
        </div>

        <section class="file-list" aria-labelledby="fileListHeading">
            <h3 id="fileListHeading">已上传文件</h3>
            <p id="fileListStatus" role="status">正在加载文件列表…</p>
            <div id="fileList"></div>
        </section>
    </div>

    <script>
        let latestFileListRequest = 0;

        function formatFileSize(bytes) {
            const units = ['B', 'KB', 'MB', 'GB'];
            let unit = 0;
            while (bytes >= 1024 && unit < units.length - 1) {
                bytes /= 1024;
                ++unit;
            }
            return `${bytes.toFixed(2)} ${units[unit]}`;
        }

        async function refreshFileList() {
            const request = ++latestFileListRequest;
            const list = document.getElementById('fileList');
            const status = document.getElementById('fileListStatus');
            status.textContent = '正在加载文件列表…';
            list.replaceChildren();

            try {
                const response = await fetch('/api/files', { cache: 'no-store' });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const { files } = await response.json();

                // 上传后的刷新可能先于页面打开时的请求完成。
                if (request !== latestFileListRequest) return;
                if (!Array.isArray(files)) throw new Error('文件列表响应格式错误');

                const rows = document.createDocumentFragment();
                for (const file of files) {
                    const row = document.createElement('div');
                    row.className = 'file-item';
                    const info = document.createElement('div');
                    info.className = 'file-info';

                    const name = document.createElement('span');
                    name.textContent = `📄${file.name}`;
                    const storageType = document.createElement('span');
                    storageType.className = 'file-type';
                    storageType.textContent = file.storage_type === 'compressed' ? '压缩存储' : '未压缩存储';
                    const size = document.createElement('span');
                    size.textContent = `存储大小：${formatFileSize(file.stored_size_bytes)}`;
                    const time = document.createElement('span');
                    time.textContent = file.modified_time;
                    info.append(name, storageType, size, time);

                    const path = file.download_url;
                    if (typeof path !== 'string' || !path.startsWith('/') || path.startsWith('//') ||
                        new URL(path, location.href).origin !== location.origin) {
                        throw new Error('下载路径无效');
                    }
                    const download = document.createElement('a');
                    download.className = 'download-link';
                    download.href = path;
                    download.textContent = '⬇️ 下载';
                    row.append(info, download);
                    rows.append(row);
                }

                list.replaceChildren(rows);
                status.textContent = files.length ? '' : '暂无上传文件';
            } catch (error) {
                if (request !== latestFileListRequest) return;
                console.error('加载文件列表失败:', error);
                status.textContent = '文件列表加载失败，请刷新页面重试。';
            }
        }

        async function uploadFile() {
            const fileInput = document.getElementById('fileInput');
            const storageType = document.querySelector('input[name="storageType"]:checked').value;
            const file = fileInput.files[0];

            if (!file) {
                alert('请先选择文件');
                return;
            }

            // Base64 编码。
            const encodedFilename = btoa(unescape(encodeURIComponent(file.name)));
            console.log("Base64 编码结果:", encodedFilename);

            try {
                // /upload 是相对 URL，具体是以网站根路径为基准的相对地址。浏览器会自动补上当前页面的协议、主机和端口，兼容 IP、域名及反向代理访问。
                const response = await fetch('/upload', {
                    method: 'POST',
                    headers: {
                        'StorageType': storageType,
                        'FileName': encodedFilename
                    },
                    body: file
                });

                if (response.ok) {
                    fileInput.value = '';
                    await refreshFileList();
                } else {
                    alert(`上传失败: ${response.status}`);
                }
            } catch (error) {
                console.error('上传错误:', error);
                alert('网络连接失败');
            }
        }

        refreshFileList();
    </script>
</body>

</html>
